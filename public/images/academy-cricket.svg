<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Throwback Cricket Academy</title>
  <desc id="desc">A branded green academy graphic with a cricket ball, bat, jersey, and Throwback logo.</desc>
  <defs>
    <linearGradient id="cricketBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07542F"/>
      <stop offset="1" stop-color="#0A7A43"/>
    </linearGradient>
    <linearGradient id="cricketJersey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EA"/>
      <stop offset="1" stop-color="#D9D3C3"/>
    </linearGradient>
    <pattern id="cricketLines" width="54" height="54" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <rect width="2" height="54" fill="#FFFFFF" opacity="0.08"/>
    </pattern>
    <filter id="cricketShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#001F12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#cricketBg)"/>
  <rect width="1200" height="675" fill="url(#cricketLines)"/>
  <circle cx="970" cy="260" r="230" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="1030" cy="390" r="130" fill="#C8252B" opacity="0.18"/>
  <g transform="translate(870 155) rotate(-18)">
    <rect x="-34" y="-210" width="68" height="420" rx="34" fill="#B8894B"/>
    <rect x="-34" y="-210" width="68" height="170" rx="34" fill="#D7AA68"/>
    <rect x="-43" y="-210" width="86" height="20" rx="10" fill="#7E5B31"/>
    <rect x="-43" y="190" width="86" height="20" rx="10" fill="#7E5B31"/>
  </g>
  <g transform="translate(890 410) rotate(-12)" filter="url(#cricketShadow)">
    <ellipse cx="0" cy="0" rx="112" ry="112" fill="#C8252B"/>
    <path d="M-83-52 C-31-18 31 18 83 52" fill="none" stroke="#F8F0E4" stroke-width="12" stroke-linecap="round"/>
    <path d="M-83 52 C-31 18 31-18 83-52" fill="none" stroke="#F8F0E4" stroke-width="12" stroke-linecap="round"/>
    <path d="M-55-83 C-19-39 19 39 55 83" fill="none" stroke="#F8F0E4" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M55-83 C19-39-19 39-55 83" fill="none" stroke="#F8F0E4" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g transform="translate(255 335)" filter="url(#cricketShadow)">
    <path d="M125 20 L185 75 L165 155 L105 195 L45 165 L25 95 Z" fill="url(#cricketJersey)" stroke="#0B7A43" stroke-width="12" stroke-linejoin="round"/>
    <path d="M125 20 L145 75 L125 155 L105 75 Z" fill="#FFFFFF" opacity="0.28"/>
    <path d="M125 20 L185 75 L165 155" fill="none" stroke="#0B7A43" stroke-width="12" stroke-linejoin="round"/>
    <path d="M105 195 L45 165 L25 95" fill="none" stroke="#0B7A43" stroke-width="12" stroke-linejoin="round"/>
    <path d="M75 62 L175 62" stroke="#0B7A43" stroke-width="8" stroke-linecap="round"/>
    <path d="M82 105 L168 105" stroke="#0B7A43" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  </g>
  <image href="/images/logo-white.png" x="225" y="285" width="62" height="62" preserveAspectRatio="xMidYMid meet"/>
  <text x="110" y="515" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="7">CRICKET</text>
  <text x="110" y="585" fill="#D8F4E2" font-family="Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="7">ACADEMY</text>
  <text x="112" y="625" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5">HARARE · ZIMBABWE</text>
  <path d="M1030 575 H1130" stroke="#D8F4E2" stroke-width="3" opacity="0.7"/>
  <text x="1030" y="610" fill="#D8F4E2" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">NEXT GENERATION</text>
</svg>