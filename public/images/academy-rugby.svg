<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Throwback Rugby Academy</title>
  <desc id="desc">A branded red academy graphic with a rugby ball, jersey, and Throwback logo.</desc>
  <defs>
    <linearGradient id="rugbyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#711717"/>
      <stop offset="1" stop-color="#B52A2A"/>
    </linearGradient>
    <linearGradient id="rugbyJersey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EA"/>
      <stop offset="1" stop-color="#D9D3C3"/>
    </linearGradient>
    <pattern id="rugbyLines" width="54" height="54" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <rect width="2" height="54" fill="#FFFFFF" opacity="0.08"/>
    </pattern>
    <filter id="rugbyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#350909" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#rugbyBg)"/>
  <rect width="1200" height="675" fill="url(#rugbyLines)"/>
  <circle cx="235" cy="250" r="230" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="160" cy="400" r="130" fill="#F4C95D" opacity="0.16"/>
  <g transform="translate(290 390) rotate(20)" filter="url(#rugbyShadow)">
    <ellipse cx="0" cy="0" rx="175" ry="92" fill="#F4C95D"/>
    <ellipse cx="0" cy="0" rx="175" ry="92" fill="none" stroke="#7E4A12" stroke-width="10"/>
    <path d="M-145 0 H145" stroke="#7E4A12" stroke-width="10" stroke-linecap="round"/>
    <path d="M-80-58 C-35-20 35 20 80 58" fill="none" stroke="#7E4A12" stroke-width="8" stroke-linecap="round"/>
    <path d="M-80 58 C-35 20 35-20 80-58" fill="none" stroke="#7E4A12" stroke-width="8" stroke-linecap="round"/>
    <path d="M-42-78 C-12-29 12 29 42 78" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
    <path d="M42-78 C12-29-12 29-42 78" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  </g>
  <g transform="translate(930 335)" filter="url(#rugbyShadow)">
    <path d="M125 20 L185 75 L165 155 L105 195 L45 165 L25 95 Z" fill="url(#rugbyJersey)" stroke="#8B1717" stroke-width="12" stroke-linejoin="round"/>
    <path d="M125 20 L145 75 L125 155 L105 75 Z" fill="#FFFFFF" opacity="0.28"/>
    <path d="M125 20 L185 75 L165 155" fill="none" stroke="#8B1717" stroke-width="12" stroke-linejoin="round"/>
    <path d="M105 195 L45 165 L25 95" fill="none" stroke="#8B1717" stroke-width="12" stroke-linejoin="round"/>
    <path d="M75 62 L175 62" stroke="#8B1717" stroke-width="8" stroke-linecap="round"/>
    <path d="M82 105 L168 105" stroke="#8B1717" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  </g>
  <image href="/images/logo-white.png" x="900" y="285" width="62" height="62" preserveAspectRatio="xMidYMid meet"/>
  <text x="790" y="515" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="7">RUGBY</text>
  <text x="790" y="585" fill="#F8D9A5" font-family="Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="7">ACADEMY</text>
  <text x="792" y="625" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5">BULAWAYO · ZIMBABWE</text>
  <path d="M110 575 H210" stroke="#F8D9A5" stroke-width="3" opacity="0.7"/>
  <text x="110" y="610" fill="#F8D9A5" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3">BUILT TO LEAD</text>
</svg>